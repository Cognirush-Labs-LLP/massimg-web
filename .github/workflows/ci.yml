name: CI

# A change that touches only these files cannot alter what any job below checks, so it does not
# run them (a push that also touches anything else still runs everything). `content/**` is not
# listed: the FAQ and the other public pages are built and tested as part of the site.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'

# Every job runs Node 22, which is a floor rather than a preference: package.json pins
# pnpm 11.13.0, and that pnpm needs Node >= 22.13 and loads node:sqlite (new in Node 22).
# On Node 20 every job died inside actions/setup-node — before install, before any of this
# repo's code ran — because `cache: pnpm` shells out to pnpm to resolve the store path.
# Keep this in step with package.json's `packageManager` and `engines.node`.

# The browser jobs run inside Playwright's own image, which already holds the three browsers and
# the system libraries they need. Installing them on the bare runner (`playwright install
# --with-deps`) is an apt download of a hundred-odd packages; it normally takes under a minute and
# once stalled for 27. The image tag and the version check in each job must match the
# `@playwright/test` version in package.json: when that is upgraded, change all of them together.

# Cancel superseded runs on the same branch/PR so browser installs and test
# runs don't queue up behind stale pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (vue-tsc + eslint + prettier + licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A separate step, not folded into `pnpm check`: that script audits application code
      # quality and deliberately excludes 3rd_party_licenses/ from its tooling (T06). This
      # audits a different thing — that every bundled component is credited (R-V4), which the
      # credits page depends on being true.
      - run: pnpm check:licenses

  unit:
    name: unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: production build + static HTML check (F1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:ssg

  e2e:
    name: browser tests (playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright matches the container image
        run: |
          actual=$(pnpm exec playwright --version | awk '{print $2}')
          if [ "$actual" != "1.63.0" ]; then
            echo "::error::package.json resolves Playwright $actual but this job's image is v1.63.0; update the image tag and this check in .github/workflows/ci.yml"
            exit 1
          fi
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  e2e-pwa:
    name: PWA/offline tests (playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        # No webkit: see playwright.pwa.config.ts's comment — a Playwright/WebKit driver
        # limitation, not a product issue, reproduced independent of this app's code.
        project: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright matches the container image
        run: |
          actual=$(pnpm exec playwright --version | awk '{print $2}')
          if [ "$actual" != "1.63.0" ]; then
            echo "::error::package.json resolves Playwright $actual but this job's image is v1.63.0; update the image tag and this check in .github/workflows/ci.yml"
            exit 1
          fi
      - run: pnpm exec playwright test --config=playwright.pwa.config.ts --project=${{ matrix.project }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  e2e-site:
    name: public routes and SEO files (playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright matches the container image
        run: |
          actual=$(pnpm exec playwright --version | awk '{print $2}')
          if [ "$actual" != "1.63.0" ]; then
            echo "::error::package.json resolves Playwright $actual but this job's image is v1.63.0; update the image tag and this check in .github/workflows/ci.yml"
            exit 1
          fi
      - run: pnpm exec playwright test --config=playwright.site.config.ts --project=${{ matrix.project }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-site-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
